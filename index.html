<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fragrantica</title>
  </head>
  <body>
    <div id="app">
      <div class="topnav">
        <h2>Fragrantica</h2>
      </div>
      <div id="home-container">
        <h1>Find a Fragrance</h1>
        <p>Search by perfume name or brand. Results show the concentration and release year.</p>
        <div id="search-container">
          <input id="searchbar" 
                type="text" name="search" 
                placeholder="Search perfumes or brands..">
          <button id="search-button">Search</button>
        </div>
        <div id="results"></div>
      </div>
      <div id="no-results-popup" class="popup-overlay">
        <div class="popup">
            <h2>Fragrance Not Found</h2>
            <p id="popup-message"></p>
            <button id="revise-search">Revise Search</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
