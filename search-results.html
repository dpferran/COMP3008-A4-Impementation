<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Results - Fragrantica</title>
</head>
<body>
    <div id="app">
        <div class="topnav">
            <h2>Fragrantica</h2>

            <div id="nav-search-container">
                <div id="nav-search">
                    <input id="searchbar"
                        type="text"
                        name="search"
                        placeholder="Search perfumes or brands...">

                    <button id="search-button">Search</button>
                </div>

                <div id="results"></div>
            </div>
        </div>

        <div id="search-results-container">
            <h1 id="results-heading"></h1>
            <h3 id="results-desc"></h3>

            <h2>Top Result</h2>
            <div id="top-result"></div>

            <h2>Other Matches</h2>
            <div id="other-results"></div>
        </div>
        <div id="no-results-popup" class="popup-overlay">
            <div class="popup">
                <h2>Fragrance Not Found</h2>
                <p id="popup-message"></p>
                <button id="revise-search">Revise Search</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/search.js"></script>
</body>
</html>
